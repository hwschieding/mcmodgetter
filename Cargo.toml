[package]
name = "mcmodgetter"
version = "1.0.0"
edition = "2024"

[dependencies]
reqwest = {version = "0.13", features = ["json", "native-tls-vendored", "query"]}
serde = {version = "1.0", features = ["derive"]}
tokio = {version = "1", features = ["full"]}
futures = "0.3"
sha2 = "0.11"
hex = "0.4"
bytes = "1"