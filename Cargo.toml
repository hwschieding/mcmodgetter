[package]
name = "mcmodgetter"
version = "1.2.1"
edition = "2024"

[dependencies]
reqwest = {version = "0.13", features = [
    "json",
    "native-tls-vendored",
    "query",
    "stream"
]}
serde = {version = "1.0", features = ["derive"]}
tokio = {version = "1", features = ["full"]}
futures = "0.3"
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
bytes = "1"
csv = "1.4.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"